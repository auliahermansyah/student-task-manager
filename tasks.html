<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Student Task Manager</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-tasks"></i>
                <span>TaskManager</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="tasks.html" class="nav-link active">
                    <i class="fas fa-list-check"></i> Tasks
                </a>
                <div class="nav-user">
                    <span id="usernameDisplay">User</span>
                    <button onclick="Auth.logout()" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header with Add Button -->
        <div class="tasks-header">
            <div>
                <h1>Your Tasks</h1>
                <p>Manage all your assignments and projects</p>
            </div>
        <button class="btn btn-primary" id="addTaskBtn">
            <i class="fas fa-plus"></i> Add New Task
        </button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="taskSearch" placeholder="Search tasks...">
            </div>
            <select id="priorityFilter">
                <option value="all">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <button class="btn btn-text" onclick="TaskManager.clearFilters()">
                <i class="fas fa-times"></i> Clear
            </button>
        </div>

        <!-- Tasks Table -->
        <div class="tasks-table-container">
            <table class="tasks-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>Title</th>
                        <th>Priority</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody">
                    <!-- Tasks will load here -->
                    <tr class="empty-row">
                        <td colspan="7">
                            <div class="empty-state">
                                <i class="fas fa-tasks"></i>
                                <h3>No tasks yet</h3>
                                <p>Click "Add New Task" to create your first task</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions hidden" id="bulkActions">
            <span id="selectedCount">0 tasks selected</span>
            <div>
                <button class="btn btn-warning" id="bulkPendingBtn">
                    <i class="fas fa-clock"></i> Mark as Pending
                </button>
                <button class="btn btn-success" id="bulkCompletedBtn">
                    <i class="fas fa-check"></i> Mark as Completed
                </button>
                <button class="btn btn-danger" id="bulkDeleteBtn">
                    <i class="fas fa-trash"></i> Delete Selected
                </button>
            </div>
        </div>

    <!-- Task Modal (for Add/Edit) -->
    <div class="modal hidden" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>
            <button class="modal-close" onclick="TaskUI.hideTaskModal()">
                    <i class="fas fa-times"></i>
            </button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                
                <div class="form-group">
                    <label for="taskTitle">Title *</label>
                    <input type="text" id="taskTitle" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-text" onclick="TaskUI.hideTaskModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/taskManager.js"></script>
</body>
</html>
